# Tuned for both desktop Android Studio and on-device Termux ARM64 builds
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# On Termux (ARM64 Android), build-termux.sh uncomments the line below so Gradle
# uses Termux's native ARM64 aapt2 instead of Google Maven's x86_64 binary:
# android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
